# METABEGIN
# X-Env-Layer-Name: journal
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Category: app
# X-Env-Layer-Desc: Secure Journal kiosk, setup service, and LAN web app on
#  Debian Trixie. NetworkManager (iwd backend) provides Wi-Fi. The touchscreen
#  session is cage and Chromium, not a desktop.
# X-Env-Layer-Requires: trixie-minbase,network-manager-iwd,device-user-admin
# METAEND
---
mmdebstrap:
  packages:
    - cage
    - chromium
    - seatd
    - dbus
    - python3
    - python3-fastapi
    - python3-uvicorn
    - python3-cryptography
    - python3-argon2
    - avahi-daemon
    - libnss-mdns
    - ufw
    - unattended-upgrades
    - iw
    - curl
    - ca-certificates
    - fonts-liberation
    - fonts-dejavu-core
