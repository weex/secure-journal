name: Image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Build inside Debian Trixie
        run: |
          docker run --privileged --rm -v "$PWD":/src -w /src debian:trixie bash -c '
            set -eu
            apt-get update
            apt-get install -y sudo git ca-certificates
            git clone --depth 1 --branch v2.9.0 https://github.com/raspberrypi/rpi-image-gen.git /opt/rpi-image-gen
            /opt/rpi-image-gen/install_deps.sh
            ./image/build.sh /opt/rpi-image-gen
          '
      - uses: actions/upload-artifact@v4
        with:
          name: secure-journal-img
          path: dist/secure-journal.img.xz
          if-no-files-found: error
          retention-days: 14
      - name: Attach the image to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/secure-journal.img.xz
